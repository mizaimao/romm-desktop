## RomM: shaders
# sharp-shimmerless keeps the pixel grid even when the scale factor is not a
# whole number, which at 640x480 is nearly always.
global.shaderset=sharp-shimmerless-lcd-crt

# GBA gets the plain version: the Perfect overlay already draws an LCD grid,
# and two grids on top of each other just looks dirty.
gba.shaderset=sharp-shimmerless

# Hotkey + dpad up/down cycles whatever lives in this directory. configgen
# writes /usr/share/knulli/shaders otherwise, which is the whole library.
global.retroarch.video_shader_dir=/userdata/shaders/romm

# The big logo when a game loads.
global.retroarch.menu_show_load_content_animation=false
## RomM: shaders end

## RomM: bezel
# mugwomp93's Perfect GBA overlay, drawn for 640x480 handhelds.
# github.com/ourigen/perfect_overlays
gba.bezel=romm
## RomM: bezel end
