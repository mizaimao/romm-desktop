## RomM: shaders
# sharp-shimmerless is the one that keeps pixels even when the scale factor
# is not a whole number -- 640x480 divides badly for most of these systems.
# The -lcd-crt variant adds an LCD grid on the handhelds and scanlines
# elsewhere. Hotkey + dpad up/down cycles the presets in
# configs/retroarch/shaders, which hold the plain and scanline versions.
global.shaderset=sharp-shimmerless-lcd-crt

# The big logo when a game loads.
global.retroarch.menu_show_load_content_animation=false
## RomM: shaders end

## RomM: bezel
# KNULLI's own GBA bezel puts the wordmark in a washed-out khaki. Same
# layout, wordmark recoloured to the console's metallic silver. Lives in
# /userdata so it survives a reboot -- /usr does not.
gba.bezel=romm
## RomM: bezel end
