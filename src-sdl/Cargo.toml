[package]
name = "romm-sdl"
version.workspace = true
edition = "2024"

# The third front end, and the one meant to outlive the other two. See
# docs/handheld-frontend.md task 3 and docs/handheld-device.md.
#
# It draws; it decides nothing. Sort orders, filters, bindings, cursor
# movement and the layout units all come from `romm_desktop`, which is why
# tasks 1 and 2 came first.
[[bin]]
name = "romm-sdl"
path = "src/main.rs"

[dependencies]
romm-desktop = { path = ".." }
anyhow = "1.0.104"

# Text: shaping, font fallback, line breaking and rasterisation.
#
# SDL_ttf was the obvious pairing and is the wrong one. It wraps FreeType and
# draws a string in *one* face — so a Japanese title in a Latin font comes out
# as a row of empty boxes, and the fix is to open several faces and guess which
# one has the glyph, which is precisely how this ends up feeling cheap. Whether
# it can shape at all depends on whether the distribution built it against
# HarfBuzz, which is not a thing we get to decide on the handheld.
#
# cosmic-text does shaping (rustybuzz), per-script fallback (fontdb, reading
# the same fontconfig directories the OS does), Unicode line breaking and
# rasterisation (swash). It is also pure Rust, so it cross-compiles to the
# handheld with nothing to install.
cosmic-text = "0.19"

# Raw GL, for the shader backdrop. SDL's renderer draws the interface; the
# backdrop is one full-screen quad drawn underneath it, and that needs the
# context directly. See src/backdrop.rs.
gl = "0.14"

# The C library, not a reimplementation. `libsdl2-dev` is already in the
# handheld's package list, so the device can build this itself and
# cross-compiling is a convenience rather than a blocker.
[dependencies.sdl2]
version = "0.38"
default-features = false
# Ask pkg-config where SDL is rather than hoping the linker's default search
# path covers it. On Apple silicon Homebrew puts it in /opt/homebrew/lib, which
# is not one of those paths, and the failure is `ld: library 'SDL2' not found`
# with nothing to say that the library is installed and one directory away.
# Debian answers the same question the same way, so this is not a Mac
# workaround — it is the portable form.
features = ["use-pkgconfig", "image"]
