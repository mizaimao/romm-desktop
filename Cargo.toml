[package]
name = "romm-desktop"
version = "0.1.0"
edition = "2024"

# The core is a library so the Tauri GUI (src-tauri/) and the CLI/TUI share one
# backend rather than reimplementing it.
[lib]
name = "romm_desktop"
path = "src/lib.rs"

[[bin]]
name = "romm-desktop"
path = "src/main.rs"

[workspace]
members = ["src-tauri"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
crossterm = "0.29.0"
futures-util = "0.3.33"
hex = "0.4.3"
md-5 = "0.11.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.21.4"
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
zip = "8.6.0"
