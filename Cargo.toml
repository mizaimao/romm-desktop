[package]
name = "romm-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
zip = "8.6.0"
