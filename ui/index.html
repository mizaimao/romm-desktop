<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RomM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="back" hidden>‹</button>
      <h1 id="title">Platforms</h1>
      <input id="search" type="search" placeholder="Search all games…" />
      <button id="sidebar-btn" hidden title="Show or hide the detail pane">Hide info</button>
      <button id="layout-btn" hidden>Grid</button>
      <button id="themes-btn" title="Console icon themes">Themes</button>
      <button id="settings-btn" title="Settings">⚙</button>
      <span id="status"></span>
    </header>

    <main>
      <section id="list"></section>
      <aside id="detail" hidden></aside>
    </main>

    <div id="lightbox" hidden>
      <button class="lb-close" title="Close (Esc)">×</button>
      <button class="lb-nav lb-prev" title="Previous (←)">‹</button>
      <figure>
        <div class="lb-stage"></div>
        <figcaption></figcaption>
      </figure>
      <button class="lb-nav lb-next" title="Next (→)">›</button>
    </div>

    <footer id="toast" hidden></footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
