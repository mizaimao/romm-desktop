name: Release

# Tag a commit to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab to get artifacts without a release.
#
# Linux and Windows only. A CI-built macOS bundle would be unsigned, so it
# arrives quarantined and needs mounting, dragging and an xattr call before it
# opens. Build it on the Mac instead: scripts/build-macos.sh
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing ships without the tests that guard it passing on the tagged commit.
  #
  # This workflow used to build and publish without running a single test, so a
  # tag on a red commit produced a real release with real download links. It is
  # the CI workflow itself rather than a copy of it: a duplicated matrix drifts,
  # and the copy that drifts is always the one nobody is watching.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # @master honours rust-toolchain.toml, so the runners use the pinned
      # version rather than whatever `stable` resolves to that week.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tauri v2 on Linux. webkit2gtk-4.1 is why this pins 22.04 rather than
      # 24.04, where the package names differ.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The desktop app. `bundle.targets` in tauri.conf.json picks the right
      # format per platform: NSIS installer on Windows, .deb and AppImage on
      # Linux. macOS is built locally instead — see scripts/build-macos.sh.
      - name: Build desktop app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # The app, published as `romm-desktop`. Cargo still calls it
          # romm-gui: the CLI crate already owns the romm-desktop bin name, and
          # two targets of the same name collide in one target directory.
          # Renaming on the way out avoids that without a confusing download.
          GUI=target/${{ matrix.target }}/release/romm-gui
          [ -f "$GUI.exe" ] && cp "$GUI.exe" "dist/romm-desktop-${{ matrix.target }}.exe" || true
          [ -f "$GUI" ] && cp "$GUI" "dist/romm-desktop-${{ matrix.target }}" || true
          B=target/${{ matrix.target }}/release/bundle
          find "$B" -maxdepth 3 \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Not a draft: a draft is invisible on the Releases page and in the
          # repo sidebar unless you are signed in as a maintainer, which makes
          # it look like the build produced nothing.
          draft: false
          make_latest: true
          name: ${{ github.ref_name }}
          body: |
            Download below. Nothing here needs installing unless you want it to.

            **Windows** — `romm-desktop-x86_64-pc-windows-msvc.exe` is the
            app, portable: the UI and the core map are both compiled into it,
            so just run it. `*-setup.exe` is the installer if you would rather
            have a Start menu entry.

            **Linux** — `romm-desktop-x86_64-unknown-linux-gnu` is the app;
            `*.AppImage` and `*.deb` are the packaged forms.

            **macOS** is not built here on purpose: an unsigned bundle arrives
            quarantined and needs an `xattr` call before it will open. Build it
            on the Mac with `scripts/build-macos.sh`.

            Copy `config.example.toml` to `config.toml` and set `[server]`
            before first run.
