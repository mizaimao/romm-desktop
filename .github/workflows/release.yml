name: Release

# Tag a commit to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab to get artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple silicon)
            target: aarch64-apple-darwin
          - os: macos-13
            label: macOS (Intel)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tauri v2 on Linux. webkit2gtk-4.1 is why this pins 22.04 rather than
      # 24.04, where the package names differ.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The CLI/TUI. No system libraries needed: rustls uses *ring* and rusqlite
      # is bundled, so this is a plain cargo build on every platform.
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin romm-desktop

      # The desktop app. `bundle.targets` in tauri.conf.json picks the right
      # format per platform: .app on macOS, NSIS installer on Windows,
      # .deb and AppImage on Linux.
      - name: Build desktop app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/romm-desktop
          [ -f "$BIN.exe" ] && cp "$BIN.exe" "dist/romm-desktop-${{ matrix.target }}.exe" || true
          [ -f "$BIN" ] && cp "$BIN" "dist/romm-desktop-${{ matrix.target }}" || true
          B=target/${{ matrix.target }}/release/bundle
          find "$B" -maxdepth 3 \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          # macOS .app is a directory — ship it as a tarball
          if [ -d "$B/macos" ]; then
            tar -czf "dist/RomM-Desktop-${{ matrix.target }}.app.tar.gz" -C "$B/macos" .
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
