name: Release

# Tag a commit to publish:  git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab to get artifacts without a release.
#
# Linux and Windows only. A CI-built macOS bundle would be unsigned, so it
# arrives quarantined and needs mounting, dragging and an xattr call before it
# opens. Build it on the Mac instead: scripts/build-macos.sh
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # @master honours rust-toolchain.toml, so the runners use the pinned
      # version rather than whatever `stable` resolves to that week.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tauri v2 on Linux. webkit2gtk-4.1 is why this pins 22.04 rather than
      # 24.04, where the package names differ.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The CLI/TUI. No system libraries needed: rustls uses *ring* and rusqlite
      # is bundled, so this is a plain cargo build on every platform.
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin romm-desktop

      # The desktop app. `bundle.targets` in tauri.conf.json picks the right
      # format per platform: NSIS installer on Windows, .deb and AppImage on
      # Linux. macOS is built locally instead — see scripts/build-macos.sh.
      - name: Build desktop app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/romm-desktop
          [ -f "$BIN.exe" ] && cp "$BIN.exe" "dist/romm-desktop-${{ matrix.target }}.exe" || true
          [ -f "$BIN" ] && cp "$BIN" "dist/romm-desktop-${{ matrix.target }}" || true
          # The GUI executable itself, alongside the installer. The whole UI is
          # embedded in the binary, so this runs as-is with nothing to install —
          # which is what you want for testing a build on another machine.
          GUI=target/${{ matrix.target }}/release/romm-gui
          [ -f "$GUI.exe" ] && cp "$GUI.exe" "dist/romm-gui-${{ matrix.target }}.exe" || true
          [ -f "$GUI" ] && cp "$GUI" "dist/romm-gui-${{ matrix.target }}" || true
          B=target/${{ matrix.target }}/release/bundle
          find "$B" -maxdepth 3 \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Not a draft: a draft is invisible on the Releases page and in the
          # repo sidebar unless you are signed in as a maintainer, which makes
          # it look like the build produced nothing.
          draft: false
          make_latest: true
          name: ${{ github.ref_name }}
          body: |
            Download below. Nothing here needs installing unless you want it to.

            **Windows** — `romm-gui-x86_64-pc-windows-msvc.exe` is the app,
            portable: the whole UI is embedded in the binary, so just run it.
            `*-setup.exe` is the installer if you would rather have a Start
            menu entry. `romm-desktop-*.exe` is the CLI/TUI.

            **Linux** — `romm-gui-x86_64-unknown-linux-gnu` is the app,
            `*.AppImage` and `*.deb` are the packaged forms, and
            `romm-desktop-*` is the CLI/TUI.

            **macOS** is not built here on purpose: an unsigned bundle arrives
            quarantined and needs an `xattr` call before it will open. Build it
            on the Mac with `scripts/build-macos.sh`.

            Copy `config.example.toml` to `config.toml` and set `[server]`
            before first run.
