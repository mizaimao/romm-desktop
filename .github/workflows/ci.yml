name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 rather than 24.04: Tauri v2 wants webkit2gtk-4.1, which
        # 24.04 packages under different names.
        os: [ubuntu-22.04, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # @master honours rust-toolchain.toml, so the runners use the pinned
      # version rather than whatever `stable` resolves to that week.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      # No `cargo fmt --check` gate: the tree predates rustfmt and currently
      # differs in 152 files. Run `cargo fmt --all` once and add the gate back
      # if you want it enforced.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  ui:
    name: ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the real ui/js modules against index.html in jsdom. Cheap, and it
      # catches the class of break that is invisible in the app itself: a throw
      # inside requestAnimationFrame leaves the loop running and says nothing.
      - run: npm test
